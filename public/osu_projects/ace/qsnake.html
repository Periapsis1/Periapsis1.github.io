<!DOCTYPE html>
<html>
    <head>
        <title>ACE</title>
        <link rel="stylesheet" href="./ace.css">
        <link rel="stylesheet" href="./qsnake.css" media="screen">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;400&display=swap" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.21/lodash.min.js"></script>
        <script src="./qsnake.js" charset="utf-8" defer></script>
    </head>
    <body class="site-body">
        <header>
            <h1 class="site-title">ACE</h1>
        </header>
        <main class="site-background">
            <div class="game-info">
                <p class="game-title">Qsnake</p>
                <p class="game-hint">Eat the correct words to increase your score! Eating the wrong words decreases your length by 3, so be careful!</p>
            </div>
            <div id="qsnake-container">
                <div id="qsnake-side-panel">
                    <div id="qsnake-score-display">
                        <p id="qsnake-score-string">Your score: ?</p>
                    </div>
                    <div id="qsnake-def-display">
                        <p id="qsnake-def-string">Your definition is: ?</p>
                    </div>
                </div>
                <canvas id="qsnake-canvas" width="600" height="400" onkeypress="return ">
                </canvas>
            </div>
        </main>
    </body>
</html>
